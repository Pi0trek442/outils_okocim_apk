<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Calculateur de frais</title>
<style>
  :root{
    --bg:#12141c; --panel:#1a1d29; --ink:#eae7e0; --muted:#8b8fa3; --line:#2b2f40;
    --accent:#e0616b;
    --mono:'IBM Plex Mono','SFMono-Regular',Menlo,Consolas,monospace;
    --sans:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:radial-gradient(1200px 600px at 20% -10%,#1f2333 0%,transparent 60%),
      radial-gradient(900px 500px at 100% 0%,#2b1c1e 0%,transparent 55%), var(--bg);
    color:var(--ink); font-family:var(--sans); min-height:100vh;
    display:flex; flex-direction:column; align-items:center; justify-content:center; padding:32px 16px;
  }
  .wrap{ width:100%; max-width:500px; flex:1; }
  .nav-header{ display:flex; justify-content:space-between; align-items:center; margin-bottom:16px; }
  .home-btn, .reset-btn{
    display:inline-flex; align-items:center; gap:6px; background:#14161f; border:1px solid var(--line);
    color:var(--ink); font-family:var(--mono); font-size:12px; padding:8px 14px; border-radius:10px;
    text-decoration:none; cursor:pointer; transition:all .15s ease;
  }
  .home-btn:hover, .reset-btn:hover{ border-color:var(--accent); background:#1d2130; }
  .reset-btn:hover{ border-color:var(--accent); color:var(--accent); }

  .eyebrow{ font-family:var(--mono); font-size:11px; letter-spacing:.18em; text-transform:uppercase; color:var(--muted); margin:0 0 6px 2px; }
  h1{ font-size:26px; font-weight:650; letter-spacing:-0.02em; margin:0 0 20px 2px; }
  .card{ background:var(--panel); border:1px solid var(--line); border-radius:20px; overflow:hidden; box-shadow:0 30px 60px -30px rgba(0,0,0,.6); }
  .body{ padding:26px 24px 24px; }
  .field{ margin-bottom:16px; }
  .grid2{ display:grid; grid-template-columns:1fr 1fr; gap:14px; }
  .grid3{ display:grid; grid-template-columns:1fr 1fr 1fr; gap:12px; }
  .field label{ display:block; font-size:12.5px; color:var(--muted); margin-bottom:8px; font-weight:600; }
  .field .row{ position:relative; display:flex; align-items:center; }
  .field input[type=number]{ width:100%; background:#14161f; border:1px solid var(--line); color:var(--ink); font-family:var(--mono); font-size:17px; padding:12px 38px 12px 14px; border-radius:12px; outline:none; }
  .unit{ position:absolute; right:12px; font-family:var(--mono); color:var(--muted); font-size:12px; pointer-events:none; }
  .readout{ margin-top:8px; border-radius:14px; padding:20px; background:#0e1017; border:1px solid var(--line); }
  .stat-label{ font-size:11px; letter-spacing:.14em; text-transform:uppercase; color:var(--muted); font-family:var(--mono); }
  .stat-value{ font-family:var(--mono); font-size:20px; font-weight:600; color:var(--ink); margin-top:2px; }
  .stat-row{ display:flex; justify-content:space-between; align-items:flex-end; padding:10px 0; border-bottom:1px solid var(--line); }
  .stat-row.highlight .stat-value{ color:var(--accent); font-size:30px; }
  .foot{ text-align:center; font-size:11.5px; color:var(--muted); margin-top:24px; font-family:var(--mono); }
  .foot a{ color:var(--muted); text-decoration:underline; }
</style>
</head>
<body>
<div class="wrap">
  <div class="nav-header">
    <a href="outils.html" class="home-btn">← HOME</a>
    <button class="reset-btn" onclick="resetAll()">🗑️ Réinitialiser</button>
  </div>

  <div class="eyebrow">Outil // frais</div>
  <h1>Calculateur de frais</h1>

  <div class="card">
    <div class="body">
      <div class="grid2">
        <div class="field"><label>Capital initial</label><div class="row"><input type="number" id="init" value="10000"><span class="unit">€</span></div></div>
        <div class="field"><label>Dépôt mensuel</label><div class="row"><input type="number" id="pmt" value="250"><span class="unit">€</span></div></div>
      </div>
      <div class="grid2">
        <div class="field"><label>Durée</label><div class="row"><input type="number" id="years" value="15"><span class="unit">ans</span></div></div>
        <div class="field"><label>Rendement brut</label><div class="row"><input type="number" id="ret" value="4" step="0.1"><span class="unit">%</span></div></div>
      </div>
      <div class="grid3">
        <div class="field"><label>Versement</label><div class="row"><input type="number" id="feeIn" value="1" step="0.1"><span class="unit">%</span></div></div>
        <div class="field"><label>Gestion</label><div class="row"><input type="number" id="feeManage" value="1.5" step="0.1"><span class="unit">%</span></div></div>
        <div class="field"><label>Retrait</label><div class="row"><input type="number" id="feeOut" value="0.5" step="0.1"><span class="unit">%</span></div></div>
      </div>

      <div class="readout">
        <div class="stat-row highlight">
          <div><div class="stat-label">Capital final net</div></div>
          <div class="stat-value" id="out_net">—</div>
        </div>
      </div>
    </div>
  </div>
</div>

<div class="foot">
  100 % autonome — calculs exécutés localement<br><br>
  <a href="https://redpi.fr" target="_blank" rel="noopener">redpi.fr</a>
</div>

<script>
const fields = ['init','pmt','years','ret','feeIn','feeManage','feeOut'];
function save(){
  const data = {};
  fields.forEach(id => data[id] = document.getElementById(id).value);
  localStorage.setItem('feeCalcData', JSON.stringify(data));
}
function load(){
  const saved = localStorage.getItem('feeCalcData');
  if(saved){
    try {
      const data = JSON.parse(saved);
      fields.forEach(id => { if(data[id] !== undefined) document.getElementById(id).value = data[id]; });
    } catch(e){}
  }
}

function fmtEUR(n){ return isFinite(n) ? n.toLocaleString('fr-FR',{maximumFractionDigits:0}) + ' €' : '—'; }

function calc(){
  save();
  const init = parseFloat(document.getElementById('init').value)||0;
  const pmt = parseFloat(document.getElementById('pmt').value)||0;
  const years = parseInt(document.getElementById('years').value)||1;
  const ret = parseFloat(document.getElementById('ret').value)||0;
  const feeIn = parseFloat(document.getElementById('feeIn').value)||0;
  const feeManage = parseFloat(document.getElementById('feeManage').value)||0;
  const feeOut = parseFloat(document.getElementById('feeOut').value)||0;

  let netCapital = init * (1 - feeIn / 100);
  const netRate = (ret - feeManage) / 100 / 12;

  for(let m = 0; m < years * 12; m++){
    netCapital = netCapital * (1 + netRate) + pmt * (1 - feeIn / 100);
  }
  netCapital = netCapital * (1 - feeOut / 100);

  document.getElementById('out_net').textContent = fmtEUR(netCapital);
}

function resetAll(){
  if(confirm("Réinitialiser les paramètres ?")){
    localStorage.removeItem('feeCalcData');
    location.reload();
  }
}

fields.forEach(id => document.getElementById(id).addEventListener('input', calc));
load(); calc();
</script>
</body>
</html>
